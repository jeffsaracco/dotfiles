onboarding = false

[ui]
status_indicators = "symbols"

[theme]
name = "vesper"
auto_switch = false

[terminal]
new_cwd = "follow"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[keys]
goto = ""
cycle_pane_previous = "ctrl+h"
cycle_pane_next = "ctrl+space"
settings = "prefix+t"

[[keys.command]]
key = "prefix+shift+k"          # toggle the floating beads board
type = "plugin_action"
command = "herdr-beads.open-board"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "jeff.switch.open"
description = "switch workspace"

[[keys.command]]
key = "ctrl+semicolon"
type = "plugin_action"
command = "jeff.switch.last-tab"
description = "last tab"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-theme-picker.open"

[theme.custom]
panel_bg = "#011627"
sidebar_bg = "#001221"
active_row_bg = "#011627"
selection_bg = "#093b5e"
surface0 = "#011627"
surface1 = "#575656"
surface_dim = "#001423"
overlay0 = "#575656"
overlay1 = "#ffffff"
text = "#cccccc"
subtext0 = "#ffffff"
accent = "#82aaff"
mauve = "#c792ea"
green = "#22da6e"
yellow = "#c5e478"
red = "#ef5350"
blue = "#82aaff"
teal = "#21c7a8"
peach = "#ef5350"
