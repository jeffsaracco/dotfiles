onboarding = false

[ui]
status_indicators = "symbols"

[theme]
name = "gruvbox"
auto_switch = false

[terminal]
new_cwd = "follow"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[keys]
goto = ""
cycle_pane_previous = "ctrl+h"
cycle_pane_next = "ctrl+space"
settings = "prefix+t"

[[keys.command]]
key = "prefix+shift+k"          # toggle the floating beads board
type = "plugin_action"
command = "herdr-beads.open-board"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "jeff.switch.open"
description = "switch workspace"

[[keys.command]]
key = "ctrl+semicolon"
type = "plugin_action"
command = "jeff.switch.last-tab"
description = "last tab"
